publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3

  # UI
  shadcn_ui: ^0.28.5
  file_picker: ^10.3.3
  cached_network_image: ^3.4.1
  intl: ^0.20.2

